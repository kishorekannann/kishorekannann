name: Update TUF Stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  update-tuf-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch TUF Stats & Generate SVG
        run: |
          python3 << 'EOF'
          import urllib.request
          import json

          username = "kishorekannann"
          url = f"https://backend-go.takeuforward.org/api/v1/shared/profile/dsa-progress/{username}"
          req = urllib.request.Request(url, headers={
              "accept": "application/json, text/plain, */*",
              "origin": "https://takeuforward.org",
              "referer": "https://takeuforward.org/",
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          })

          try:
              with urllib.request.urlopen(req, timeout=10) as res:
                  body = json.loads(res.read())
                  data = body["data"]["data"]
                  easy   = data.get("solvedEasy", 0)
                  medium = data.get("solvedMedium", 0)
                  hard   = data.get("solvedHard", 0)
                  total  = easy + medium + hard
                  print(f"Fetched: Easy={easy} Medium={medium} Hard={hard}")
          except Exception as e:
              print(f"API Error: {e} — using fallback zeros")
              easy, medium, hard, total = 0, 0, 0, 0

          svg = f'''<svg width="380" height="150" xmlns="http://www.w3.org/2000/svg">
            <rect width="380" height="150" rx="10" fill="#1e293b"/>
            <text x="20" y="32" font-family="Segoe UI, sans-serif" font-size="16" font-weight="bold" fill="#38bdf8">TakeUForward (TUF+) Stats</text>
            <line x1="20" y1="42" x2="360" y2="42" stroke="#334155" stroke-width="1"/>
            <text x="20" y="68"  font-family="Segoe UI, sans-serif" font-size="13" fill="#94a3b8">Total Solved</text>
            <text x="360" y="68"  font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#f1f5f9" text-anchor="end">{total}</text>
            <text x="20" y="95"  font-family="Segoe UI, sans-serif" font-size="13" fill="#94a3b8">Easy</text>
            <text x="360" y="95"  font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#22c55e" text-anchor="end">{easy}</text>
            <text x="20" y="118" font-family="Segoe UI, sans-serif" font-size="13" fill="#94a3b8">Medium</text>
            <text x="360" y="118" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#f59e0b" text-anchor="end">{medium}</text>
            <text x="20" y="141" font-family="Segoe UI, sans-serif" font-size="13" fill="#94a3b8">Hard</text>
            <text x="360" y="141" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#ef4444" text-anchor="end">{hard}</text>
          </svg>'''

          with open("tuf-stats.svg", "w") as f:
              f.write(svg)
          print(f"SVG written successfully. Total: {total}")
          EOF

      - name: Commit SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tuf-stats.svg
          git diff --cached --quiet || git commit -m "chore: update TUF stats [skip ci]"
          git push
